services:
  # Backend API Web Service
  - type: web
    name: ganeshannadanam-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npx tsx src/server.ts
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"

  # Frontend Static Site
  - type: web
    name: ganeshannadanam-website
    env: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
